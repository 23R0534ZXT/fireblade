name: Report a bug
description: Report a reproducible issue with Kagarasu Host or the historical Desktop edition.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        One problem per issue. Please search the existing issues first, and remove
        anything sensitive from screenshots, paths and logs before posting.
  - type: dropdown
    id: edition
    attributes:
      label: Deployment
      options:
        - Host (single container)
        - Host (per-case driver)
        - Host (source checkout)
        - Windows Desktop
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: For Host, see the status bar or /health. For Desktop, open Help → About.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Runtime environment
      description: For Host, include the OS, browser and Docker version if applicable. For Desktop, include the Windows version.
    validations:
      required: true
  - type: dropdown
    id: dataset
    attributes:
      label: What were you working on?
      options:
        - A public sample dataset (test pack, raw artifacts, 3 GiB CSV)
        - My own collection
        - A single file I can share or describe
        - A disk image
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you clicked, in order. Mention the file format if it matters.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The exact message, a screenshot, or the export report if you have one.
    validations:
      required: true
