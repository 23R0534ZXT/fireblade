name: Signaler un bug / Report a bug
description: Décrire un problème reproductible dans Fireblade.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Un problème par issue. Vérifiez les issues existantes et masquez les informations sensibles. Les retours généraux vont dans l’issue #6."
  - type: input
    id: version
    attributes:
      label: Version de Fireblade et tag de la release
      description: Voir Aide → À propos et la page de téléchargement.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Version de Windows
      placeholder: Windows 11 x64, 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      description: Indiquez le format du fichier et si le problème existe avec le pack public.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Résultat obtenu
      description: Message d’erreur exact, capture ou journal expurgé si disponible.
    validations:
      required: true
