name: Report a bug
description: Describe a problem that can be reproduced in Fireblade.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        One problem per issue. Please search the existing issues first, and remove
        anything sensitive from screenshots, paths and logs before posting.
  - type: input
    id: version
    attributes:
      label: Fireblade version
      description: Shown in Help → About, and in the release tag you downloaded.
      placeholder: 0.4.2 (v0.4.2)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 x64, 24H2
    validations:
      required: true
  - type: dropdown
    id: dataset
    attributes:
      label: What were you working on?
      options:
        - A public sample dataset (test pack, raw artifacts, 3 GiB CSV)
        - My own collection
        - A single file I can share or describe
        - A disk image
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you clicked, in order. Mention the file format if it matters.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The exact message, a screenshot, or the export report if you have one.
    validations:
      required: true
