name: Host containers

# The two images of the Host edition, published where `docker run` can reach them:
#   ghcr.io/<owner>/fireblade-host    the case image (readers, .NET, no Qt)
#   ghcr.io/<owner>/fireblade-driver  the driver that gives each case its container
#
# main publishes `edge`; a version tag vX.Y.Z publishes X.Y.Z, X.Y and latest.

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/host/**'
      - 'requirements-core.txt'
      - 'requirements-driver.txt'
      - 'requirements/runtime.txt'
      - 'src/fireblade/**'
      - 'config/forensic-toolchain.json'
      - 'scripts/fetch_readers.py'
      - '.github/workflows/containers.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Two names, one image: `fireblade` is the short one the README promises —
          # `docker run -p 8080:8080 ghcr.io/<owner>/fireblade` — and `fireblade-host`
          # keeps the name the deploy notes have always used.
          images: |
            ghcr.io/${{ github.repository }}
            ghcr.io/${{ github.repository }}-host
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and push the case image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=host
          cache-to: type=gha,mode=max,scope=host

  driver:
    name: Driver image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-driver
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and push the driver image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/host/Dockerfile.driver
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=driver
          cache-to: type=gha,mode=max,scope=driver
