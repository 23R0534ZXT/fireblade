name: Desktop v0.7.9 native reference

on:
  pull_request:
    branches: [codex/host-desktop-parity]
    paths: ['.github/workflows/desktop-reference-qa.yml']

permissions:
  contents: read

jobs:
  published-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify the published Desktop package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetName = 'Fireblade-0.7.9-win64.zip'
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v0.7.9" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $asset = $release.assets | Where-Object name -eq $assetName
          if ($asset.digest -notmatch '^sha256:([a-fA-F0-9]{64})$') { throw 'The release asset has no SHA-256 digest' }
          $expected = $Matches[1]
          gh release download v0.7.9 --repo "$env:GITHUB_REPOSITORY" --pattern $assetName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = (Get-FileHash -Path $assetName -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Desktop ZIP SHA-256 mismatch' }
          Expand-Archive $assetName -DestinationPath reference
          $exe = Get-ChildItem reference -Recurse -Filter Fireblade.exe | Select-Object -First 1
          if (-not $exe) { throw 'Fireblade.exe missing from the release archive' }
          "DESKTOP_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          New-Item -ItemType Directory artifacts -Force | Out-Null
          "v0.7.9 $assetName sha256:$actual" > artifacts/release.txt
      - name: Capture the exact published executable on Windows
        run: python -m scripts.windows.visual_matrix --exe "$env:DESKTOP_EXE" --out artifacts/visual
        shell: pwsh
      - name: Verify the published Windows workspace
        run: python -m scripts.windows.workspace --exe "$env:DESKTOP_EXE" --out artifacts/workspace
        shell: pwsh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Desktop-v079-native-results
          path: artifacts/
