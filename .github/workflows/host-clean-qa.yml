name: Host clean Docker qualification

on:
  pull_request:
    branches: [codex/host-desktop-parity]
    paths: ['.github/workflows/host-clean-qa.yml']

permissions:
  contents: read

jobs:
  clean-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: host
            file: Dockerfile
          - component: driver
            file: deploy/host/Dockerfile.driver
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build without cached layers
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          load: true
          pull: true
          no-cache: true
          tags: fireblade-qa:${{ matrix.component }}
      - name: Driver starts
        if: matrix.component == 'driver'
        run: docker run --rm fireblade-qa:driver python -m fireblade.web.agency --help
      - uses: actions/setup-python@v5
        if: matrix.component == 'host'
        with:
          python-version: '3.12'
      - name: Run the strict import qualification
        if: matrix.component == 'host'
        run: |
          python -m pip install -r requirements-core.txt
          python -m pip install -e . --no-deps
          python -m scripts.test_pack.package --out artifacts/pack --volume-rows 2000 --source-commit "$GITHUB_SHA"
          python -m scripts.recette.host_recette --pack artifacts/pack/Fireblade-Test-Pack-v1 \
            --image fireblade-qa:host --report artifacts/recette-strict.json --strict
      - uses: actions/upload-artifact@v4
        if: always() && matrix.component == 'host'
        with:
          name: Host-clean-recette
          path: artifacts/recette-strict.json
