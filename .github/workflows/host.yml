name: Host (Linux)

# What a change to the Host must pass before it is merged: formatting, lint, the whole suite on
# Linux including the tests that drive the client with a real mouse, and a smoke test of the images.

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', 'licenses/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/runtime.txt
      - name: System libraries (the suite imports Qt, headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libgl1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,web,browser]'
          python -m playwright install --with-deps chromium
      - name: Formatting
        run: python -m ruff format --check src scripts tests
      - name: Lint
        run: python -m ruff check src scripts tests
      - name: Client JavaScript syntax
        run: |
          for file in src/fireblade/web/static/*.js; do node --check "$file"; done
      - name: Suite, browser tests included
        run: python -m pytest tests -q --ignore=tests/windows --junitxml=artifacts/host-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Host-test-results
          path: artifacts/*.xml
          retention-days: 14

  images:
    name: Images build and answer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the case image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: fireblade:ci
          cache-from: type=gha,scope=host
      - name: The case image answers on /health
        run: |
          docker run -d --name fireblade-ci -p 127.0.0.1:8080:8080 fireblade:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then exit 0; fi
            sleep 2
          done
          docker logs fireblade-ci
          exit 1
      - name: The page is served
        run: curl -fsS http://127.0.0.1:8080/ | grep -q "Fireblade"
      - name: Build the driver image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/host/Dockerfile.driver
          load: true
          tags: fireblade-driver:ci
      - name: The driver starts
        run: docker run --rm fireblade-driver:ci python -m fireblade.web.agency --help

  recette:
    name: Recette on the real image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-core.txt
      - name: Install what the pack builder and the harness import
        run: |
          python -m pip install -r requirements-core.txt
          python -m pip install -e . --no-deps
      - name: Build the test pack from its pinned public artifacts
        run: python -m scripts.test_pack.package --out artifacts/pack --volume-rows 2000 --source-commit "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@v3
      - name: Build the case image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: fireblade:ci
          cache-from: type=gha,scope=host
      - name: Put the pack through the image and compare with what it is known to hold
        # Not blocking yet: the first runs on real artifacts calibrate the expectations that are
        # not pinned. The report says, check by check, what was measured; the import, the
        # accounting of every file and the absence of errors already fail the run.
        run: >-
          python -m scripts.recette.host_recette --pack artifacts/pack/Fireblade-Test-Pack-v1
          --image fireblade:ci --report artifacts/recette.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Recette-report
          path: artifacts/recette.json
          retention-days: 30
