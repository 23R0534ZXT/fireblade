name: Qualify and publish large RAW artifact pack

on:
  push:
    branches: [main]
    paths:
      - 'scripts/raw_pack/**'
      - 'tests/raw_pack/**'
      - 'config/raw-pack-sources.json'
      - 'requirements/raw-pack.txt'
      - '.github/workflows/raw-pack.yml'
  workflow_dispatch:
    inputs:
      publish_pack:
        description: Publish this new raw pack only after native qualification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: raw-artifact-pack
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/raw-pack.txt pytest
      - run: python -m ruff check scripts/raw_pack tests/raw_pack
      - run: python -m pytest --confcutdir=tests/raw_pack tests/raw_pack -q

  qualify:
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: windows
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Read the immutable application reference
        id: reference
        shell: pwsh
        run: |
          python -c "from scripts.test_pack.package import APP_COMMIT,APP_RELEASE; print('commit='+APP_COMMIT); print('tag='+APP_RELEASE)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.reference.outputs.commit }}
          path: build/reference-app
      - run: python -m pip install -r requirements/raw-pack.txt
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fireblade-raw-cache
          key: raw-sources-${{ hashFiles('config/raw-pack-sources.json') }}
      - name: Assemble at least 3 GiB of raw native artifacts and Linux logs
        run: python -m scripts.raw_pack.package --out "$env:RUNNER_TEMP/fireblade-raw-pack" --cache "$env:RUNNER_TEMP/fireblade-raw-cache"
      - name: Download the qualified Windows executable
        run: gh release download ${{ steps.reference.outputs.tag }} --pattern Fireblade.exe --dir build/qualified-app
      - name: Parse all inputs with native engines and validate exact synthetic log counts
        env:
          PYTHONPATH: build/reference-app/src
        run: python -m scripts.raw_pack.validate_windows --directory "$env:RUNNER_TEMP/fireblade-raw-pack" --exe build/qualified-app/Fireblade.exe --out artifacts/raw-validation
      - name: Independently verify ZIP bytes and publish only when requested
        shell: pwsh
        run: |
          $arguments = @('-m', 'scripts.raw_pack.finalize', '--directory', "$env:RUNNER_TEMP/fireblade-raw-pack")
          if ('${{ inputs.publish_pack }}' -eq 'true') { $arguments += '--publish' }
          python @arguments
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Raw-pack-validation
          path: |
            artifacts/raw-validation/validation-windows.json
            ${{ runner.temp }}/fireblade-raw-pack/publication.json
            ${{ runner.temp }}/fireblade-raw-pack/SHA256SUMS.txt
            ${{ runner.temp }}/fireblade-raw-pack/release-notes.md
          retention-days: 30
