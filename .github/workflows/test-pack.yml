name: Publish downloadable forensic test pack

on:
  push:
    branches: [main]
    paths:
      - 'scripts/test_pack/**'
      - '.github/workflows/test-pack.yml'
  workflow_dispatch:
    inputs:
      publish_pack:
        description: Publish a new pack version (an existing published version is never replaced)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-forensic-test-pack
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: windows
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/runtime.txt
      - name: Read the qualified application reference
        id: reference
        shell: pwsh
        run: |
          python -c "from scripts.test_pack.package import APP_COMMIT,APP_SHA256,APP_RELEASE; print('commit='+APP_COMMIT); print('sha256='+APP_SHA256); print('tag='+APP_RELEASE)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.reference.outputs.commit }}
          path: build/reference-app
      - run: >-
          python -m pip install --only-binary=:all: -r build/reference-app/requirements/runtime.txt pyinstaller
      - name: Build ZIP and verify every decompressed file hash
        env:
          PYTHONPATH: build/reference-app/src
        run: python -m scripts.test_pack.package --out artifacts/test-pack --source-commit "$env:GITHUB_SHA"
      - name: Download the qualified application
        run: gh release download ${{ steps.reference.outputs.tag }} --pattern Fireblade.exe --dir build/qualified-app
      - name: Parse and render the exact ZIP with the qualified embedded engines
        env:
          PYTHONPATH: build/reference-app/src
        run: python -m scripts.test_pack.validate_windows --archive artifacts/test-pack/Fireblade-Test-Pack-v1.zip --exe build/qualified-app/Fireblade.exe --out artifacts/test-pack/verification
      - name: Publish immutable test-data release after validation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_pack }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = python -c "from scripts.test_pack.package import TAG; print(TAG)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read pack version' }
          $state = gh release view $tag --json isDraft --jq '.isDraft' 2>$null
          $exists = $LASTEXITCODE -eq 0
          if ($exists -and $state.Trim() -ne 'true') { throw 'Published test pack is immutable; bump the pack version.' }
          $notes = 'artifacts/test-pack/release-notes.md'
          @"
          ZIP prêt à extraire : artefacts Windows pour les 13 EZ Tools, Shellbags, WebCache, EVTX/Hayabusa, exemple CatScale synthétique en dossier et archive, scénario de 100 000 lignes et exports CSV/TSV/XLSX.

          Guide français, résultats attendus, sources, licences et SHA-256 inclus. Les artefacts Windows proviennent de sources publiques indépendantes. L'avertissement de ruche sale du jeu Shellbags est attendu.

          Le ZIP exact a été parsé et ses résultats affichés sous Windows avec les moteurs de l'exécutable qualifié ${{ steps.reference.outputs.commit }}. Télécharger Fireblade-Test-Pack-v1.zip ; les autres fichiers sont les rapports de validation et d'intégrité. Le CSV de 3 Gio reste dans sa release séparée.
          "@ | Set-Content $notes -Encoding utf8
          if (-not $exists) {
            gh release create $tag --draft --prerelease --latest=false --target $env:GITHUB_SHA --title 'Fireblade - pack de test Windows et CatScale v1' --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not create test-pack draft' }
          }
          gh release upload $tag artifacts/test-pack/Fireblade-Test-Pack-v1.zip artifacts/test-pack/SHA256SUMS.txt artifacts/test-pack/publication.json artifacts/test-pack/validation-windows.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Test-pack upload failed' }
          gh release edit $tag --draft=false --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Test-pack publication failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Forensic-test-pack-metadata
          path: |
            artifacts/test-pack/publication.json
            artifacts/test-pack/SHA256SUMS.txt
            artifacts/test-pack/validation-windows.json
          retention-days: 30
