name: Windows tests and standalone EXE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      profile_only:
        description: Run only the native Windows source stall diagnostic
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    if: ${{ !inputs.profile_only }}
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      QT_QPA_PLATFORM: windows
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
          cache-dependency-path: requirements/runtime.txt
      - run: >-
          python -m pip install --only-binary=:all: -r requirements/runtime.txt pytest
      - run: python -m pytest -q --junitxml=artifacts/windows-source-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-tests-python-${{ matrix.python }}
          path: artifacts/
          retention-days: 14

  publish:
    name: Publish standalone prototype
    needs: qualification
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Fireblade-exe
          path: dist
      - name: Publish only Fireblade.exe as the release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: prototype-${{ github.sha }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $hash = (Get-FileHash dist/Fireblade.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = Join-Path $env:RUNNER_TEMP 'fireblade-release-notes.md'
          Get-Content docs/development/RELEASE-NOTES.md -Raw | Set-Content $notes -Encoding utf8
          Add-Content $notes "`nCommit : $env:GITHUB_SHA`n`nSHA-256 de Fireblade.exe : $hash" -Encoding utf8
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG dist/Fireblade.exe --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Envoi du fichier autonome impossible' }
            gh release edit $env:RELEASE_TAG --notes-file $notes --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:RELEASE_TAG dist/Fireblade.exe --target $env:GITHUB_SHA --prerelease --title "Fireblade - prototype Windows" --notes-file $notes --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publication du fichier autonome impossible' }

  portable:
    name: Windows x64 executable
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build one EXE and run it alone in an empty folder
        run: python -m scripts.windows.build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-single-file-verification
          path: artifacts/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Fireblade-exe
          path: dist/Fireblade.exe
          if-no-files-found: error
          retention-days: 14

  qualification:
    name: Windows visual and 3-GiB qualification
    needs: portable
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: Fireblade-exe
          path: dist
      - name: Render light and dark Windows preferences at 100 125 150 200 percent
        run: python -m scripts.windows.visual_matrix --exe dist/Fireblade.exe --out artifacts/visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-visual-captures
          path: |
            artifacts/visual/**/*.json
            artifacts/visual/**/*.png
          retention-days: 14
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fireblade-data
          key: fireblade-csv-2382777d3917a973a1e5104b3bc404d02d3901aeff8104d34fc30e4264776cf0
      - name: Reuse the published 3-GiB CSV and verify its SHA-256
        id: dataset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: always() && !cancelled()
        run: python -m scripts.windows.qualify prepare --directory "$env:RUNNER_TEMP/fireblade-data" --out artifacts/large-data --gib 3
      - name: Import group sort filter annotate export cancel and reopen in the actual EXE
        if: ${{ !cancelled() && steps.dataset.outcome == 'success' }}
        run: python -m scripts.windows.qualify run --directory "$env:RUNNER_TEMP/fireblade-data" --out artifacts/large-data --exe dist/Fireblade.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-3GiB-report-and-captures
          path: |
            artifacts/large-data/*.json
            artifacts/large-data/*.png
          retention-days: 14


  profile:
    name: Native Windows responsiveness diagnostic
    if: github.event_name == 'workflow_dispatch' && inputs.profile_only
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: windows
      PYTHONUTF8: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --only-binary=:all: -r requirements/runtime.txt
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fireblade-data
          key: fireblade-csv-2382777d3917a973a1e5104b3bc404d02d3901aeff8104d34fc30e4264776cf0
      - run: python -m scripts.windows.profile_gui --out artifacts/profile --data "$env:RUNNER_TEMP/fireblade-data"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-responsiveness-profile
          path: |
            artifacts/profile/*.json
            artifacts/profile/*.png
          retention-days: 14
