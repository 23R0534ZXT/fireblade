name: Windows tests and standalone EXE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      QT_QPA_PLATFORM: windows
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
          cache-dependency-path: requirements/runtime.txt
      - run: >-
          python -m pip install --only-binary=:all: -r requirements/runtime.txt pytest
      - run: python -m pytest -q --junitxml=artifacts/windows-source-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-tests-python-${{ matrix.python }}
          path: artifacts/
          retention-days: 14

  publish:
    name: Publish standalone prototype
    needs: portable
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Fireblade-exe
          path: dist
      - name: Publish only Fireblade.exe as the release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: prototype-${{ github.sha }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG dist/Fireblade.exe --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:RELEASE_TAG dist/Fireblade.exe --target $env:GITHUB_SHA --prerelease --title "Fireblade - prototype Windows" --notes-file docs/development/RELEASE-NOTES.md --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publication du fichier autonome impossible' }

  portable:
    name: Windows x64 executable
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build one EXE and run it alone in an empty folder
        run: python -m scripts.windows.build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-single-file-verification
          path: artifacts/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Fireblade-exe
          path: dist/Fireblade.exe
          if-no-files-found: error
          retention-days: 14
