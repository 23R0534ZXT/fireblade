name: Windows tests and standalone EXE

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
    paths-ignore: ['README.md', 'docs/**', 'licenses/**', 'scripts/raw_pack/**', 'scripts/test_pack/**', 'tests/raw_pack/**', 'config/raw-pack-sources.json', 'requirements/raw-pack.txt', '.github/workflows/raw-pack.yml']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish an explicitly requested new application version after all checks
        type: boolean
        default: false
      full_validation:
        description: Run the full test suite on Python 3.11, 3.12 and 3.13
        type: boolean
        default: false
      profile_only:
        description: Run only the native Windows source stall diagnostic
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    if: ${{ !inputs.profile_only }}
    name: Python syntax and name checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.14.3
      - run: python -m ruff check src scripts tests

  tests:
    if: ${{ !inputs.profile_only }}
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.full_validation && '["3.11","3.12","3.13"]' || '["3.12"]') }}
    env:
      QT_QPA_PLATFORM: windows
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
          cache-dependency-path: requirements/runtime.txt
      - run: >-
          python -m pip install --only-binary=:all: -r requirements/runtime.txt pytest
      - name: Focused regression suite (full matrix on request)
        shell: pwsh
        run: |
          if ('${{ inputs.full_validation }}' -eq 'true') {
            python -m pytest -q --junitxml=artifacts/windows-source-tests.xml
          } else {
            python -m pytest -q tests/core/test_engine.py tests/core/test_low_memory_import.py tests/core/test_low_memory_export.py tests/core/test_coverage.py tests/core/test_ordering.py tests/core/test_case_storage.py tests/core/test_settings.py tests/ui/test_appearance.py tests/ui/test_case_storage_desktop.py tests/test_release.py tests/test_update_release_readme.py tests/test_publish_qualified.py --junitxml=artifacts/windows-source-tests.xml
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-tests-python-${{ matrix.python }}
          path: artifacts/
          retention-days: 14

  publish:
    name: Publish standalone prototype
    needs: [quality, tests, qualification, visual, native_storage, many_documents, native_readers]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release && !inputs.profile_only) }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: Fireblade-exe
          path: dist
      - name: Publish only Fireblade.exe as the release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python -m scripts.release --exe dist/Fireblade.exe
      - name: Update README with the verified published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.update_release_readme

  native_storage:
    name: Native Windows UNC and long paths
    if: ${{ !inputs.profile_only }}
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      FIREBLADE_TEST_SMB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --only-binary=:all: -r requirements/runtime.txt pytest
      - run: python -m pytest tests/core/test_native_windows_storage.py -q --junitxml=artifacts/windows-storage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-native-storage
          path: artifacts/
          retention-days: 14

  portable:
    name: Windows x64 executable
    if: ${{ !inputs.profile_only }}
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build one EXE and run it alone in an empty folder
        run: python -m scripts.windows.build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-single-file-verification
          path: artifacts/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Fireblade-exe
          path: dist/Fireblade.exe
          if-no-files-found: error
          retention-days: 14

  native_readers:
    name: Native upstream reader matrix
    if: ${{ !inputs.profile_only }}
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: >-
          python -m pip install --only-binary=:all: -r requirements/runtime.txt
      - run: dotnet publish src/fireblade/plugin_host/Fireblade.PluginHost.csproj -c Release -r win-x64 --self-contained true -o build/reader-host
      - run: python -m scripts.windows.reader_matrix --host build/reader-host/Fireblade.PluginHost.exe --out artifacts/readers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-upstream-reader-matrix
          path: artifacts/readers/
          retention-days: 14

  many_documents:
    name: Native EXE with 320 analyses
    needs: portable
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: Fireblade-exe
          path: dist
      - run: python -m scripts.windows.workspace --exe dist/Fireblade.exe --out artifacts/workspace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-320-analysis-report-and-captures
          path: |
            artifacts/workspace/*.json
            artifacts/workspace/*.png
          retention-days: 14

  qualification:
    name: Windows visual and 3-GiB qualification
    needs: portable
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: Fireblade-exe
          path: dist
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fireblade-data
          key: fireblade-csv-2382777d3917a973a1e5104b3bc404d02d3901aeff8104d34fc30e4264776cf0
      - name: Reuse the published 3-GiB CSV and verify its SHA-256
        id: dataset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: always() && !cancelled()
        run: python -m scripts.windows.qualify prepare --directory "$env:RUNNER_TEMP/fireblade-data" --out artifacts/large-data --gib 3
      - name: Import group sort filter annotate export cancel and reopen in the actual EXE
        if: ${{ !cancelled() && steps.dataset.outcome == 'success' }}
        run: python -m scripts.windows.qualify run --directory "$env:RUNNER_TEMP/fireblade-data" --out artifacts/large-data --exe dist/Fireblade.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-3GiB-report-and-captures
          path: |
            artifacts/large-data/*.json
            artifacts/large-data/*.png
          retention-days: 14


  visual:
    name: Windows visual qualification
    needs: portable
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: Fireblade-exe
          path: dist
      - name: Render light and dark Windows preferences at 100 125 150 200 percent
        run: python -m scripts.windows.visual_matrix --exe dist/Fireblade.exe --out artifacts/visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-visual-captures
          path: |
            artifacts/visual/**/*.json
            artifacts/visual/**/*.png
          retention-days: 14

  profile:
    name: Native Windows responsiveness diagnostic
    if: github.event_name == 'workflow_dispatch' && inputs.profile_only
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: windows
      PYTHONUTF8: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --only-binary=:all: -r requirements/runtime.txt
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fireblade-data
          key: fireblade-csv-2382777d3917a973a1e5104b3bc404d02d3901aeff8104d34fc30e4264776cf0
      - run: python -m scripts.windows.profile_gui --out artifacts/profile --data "$env:RUNNER_TEMP/fireblade-data"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-responsiveness-profile
          path: |
            artifacts/profile/*.json
            artifacts/profile/*.png
          retention-days: 14
