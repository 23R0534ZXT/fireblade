name: Windows native and portable

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      QT_QPA_PLATFORM: windows
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
      - run: >-
          python -m pip install --only-binary=:all: -r requirements.txt pytest
      - run: python -m pytest -q --junitxml=artifacts/windows-source-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-tests-python-${{ matrix.python }}
          path: artifacts/
          retention-days: 14

  portable:
    name: Windows x64 executable
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and run native checks inside the relocated EXE
        run: python -m scripts.build_windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-portable-verification
          path: artifacts/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Fireblade-Windows-x64
          path: dist/Fireblade-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
