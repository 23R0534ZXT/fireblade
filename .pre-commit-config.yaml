# Run before each commit:  pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.3
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: '\.(png|gif|mp4|gz|bin|dat)$'
      - id: trailing-whitespace
        exclude: '\.(md|png|gif|mp4|gz|bin|dat)$'
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: 'tests/fixtures/'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1500']
