[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fireblade-forensics"
version = "0.9.4"
description = "Local forensic investigation workspace for Windows artifacts, CatScale collections and exports"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4,<2", "pytz>=2024.1", "PySide6-Essentials>=6.8,<7", "openpyxl>=3.1.5,<4", "xlrd>=2.0.2,<3", "numpy>=2.3.5,<3", "idna==3.15", "dissect.esedb==3.18", "dissect.cstruct==4.7", "dissect.util==3.24", "lz4==4.4.4", "zstandard==0.25.0", "dissect.target==3.25.1", "dissect.fat==3.13", "dissect.extfs==3.15"]

[project.optional-dependencies]
dev = ["pytest>=8", "psutil>=6", "pyinstaller>=6", "ruff==0.14.3"]
# The text layer of a PDF. Absent, Fireblade still runs and says the reader is missing;
# present, a PDF in a seizure is readable without a second tool. No OCR either way.
pdf = ["pypdf>=4,<6"]
# Fireblade Host: the same core over HTTP. The container installs these instead of
# PySide6 (see requirements-core.txt); the desktop edition does not need them.
web = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "python-multipart>=0.0.9,<1", "httpx>=0.27,<1"]
# The tests that drive the client with a real mouse; without it they are skipped.
browser = ["playwright>=1.48,<2"]

[project.scripts]
fireblade = "fireblade.runtime.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fireblade*"]

[tool.setuptools.package-data]
"fireblade.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, upgrades and the bugbear checks that find real bugs.
select = ["E", "F", "W", "B", "UP", "I"]
ignore = [
    "E501",  # the formatter wraps code; long strings (messages, tables) stay as written
    "UP031",  # printf-style formatting is the idiom of the older modules
    "B905",  # zip() without strict=: the lengths are checked where it matters
]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares its parameters with File(), Form() and Query() as defaults.
"src/fireblade/web/server.py" = ["B008"]
# The translation tables repeat a French key on purpose where two screens share a sentence.
"src/fireblade/core/i18n.py" = ["F601"]
# The Desktop is frozen: its code is not rewritten for style, only kept running.
"src/fireblade/ui/**" = ["B007", "B008", "B023", "E402", "E731", "F841"]
"src/fireblade/validation/**" = ["B008", "B023"]
"tests/ui/**" = ["B007", "B023", "F841"]
"tests/windows/**" = ["F841"]
"scripts/benchmarks/**" = ["B007", "F841"]
# Closures defined and called inside the iteration that defines them: no late binding.
"src/fireblade/core/expressions.py" = ["B023"]
"src/fireblade/core/visual_bounds.py" = ["B023"]
"src/fireblade/core/webcache.py" = ["B023"]
"src/fireblade/core/coverage.py" = ["B023"]
"tests/core/test_outline.py" = ["B023"]

[tool.ruff.lint.isort]
known-first-party = ["fireblade", "scripts"]
