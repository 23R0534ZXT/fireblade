[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fireblade-forensics"
version = "0.1.1"
description = "Local forensic investigation workspace for Windows artifacts, CatScale collections and exports"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4,<2", "PySide6-Essentials>=6.8,<7", "openpyxl>=3.1.5,<4", "xlrd>=2.0.2,<3", "numpy>=2.3.5,<3", "idna==3.11", "dissect.esedb==3.18", "dissect.cstruct==4.7", "dissect.util==3.24", "lz4==4.4.4", "zstandard==0.25.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "psutil>=6", "pyinstaller>=6", "ruff==0.14.3"]

[project.scripts]
fireblade = "fireblade.runtime.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fireblade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
