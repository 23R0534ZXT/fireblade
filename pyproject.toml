[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fireblade-forensics"
version = "0.4.0"
description = "Local, disk-backed forensic CSV explorer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4,<2", "PySide6-Essentials>=6.8,<7", "openpyxl>=3.1.5,<4", "xlrd>=2.0.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "psutil>=6", "pyinstaller>=6"]

[project.scripts]
fireblade = "fireblade.runtime.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fireblade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
